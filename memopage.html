   <style>  
 
body {
  background-color: white;
  background: url("/backgrounds/sparklestars.gif") repeat;
}

.container {
  display: grid;
  grid-template-areas:
    "header header"
    "menu content"
    "footer footer";
  grid-template-columns: 1fr 3fr;
  gap: 3px;
  padding: 10px;
  width: 745px;
  height: 1000px;
  margin: auto;
  border-radius: 25px;
}

.container div {
  padding: 5px;
}

.container div.content {
  grid-area: content;
  height: 900px;
  width: 650px;
  margin-right: 30px;
  overflow-x: hidden;
  overflow-y: scroll;
  font-family: 'Georgia', monospace;
  text-align: justify;
  padding: 15px;
}

/* ===== Scrollbar CSS ===== */
  /* Firefox */
  * {
    scrollbar-width: thin;
    scrollbar-color: #BDB7A6 #DBD0B2;
  }

  /* Chrome, Edge, and Safari */
  *::-webkit-scrollbar {
    width: 16px;
  }

  *::-webkit-scrollbar-track {
    background: #DBD0B2;
  }

  *::-webkit-scrollbar-thumb {
    background-color: #DBD0B2;
    border-radius: 10px;
    border: 3px solid #DBD0B2;
  }

p.big {
  line-height: 1.5;
}

.img-hover-zoom {
	--scale: 1;
	--transition-duration: 250ms;
	scale: var(--scale);
	transition:
		scale 
		var(--transition-duration) 
		ease-in-out;
}

.img-hover-zoom:hover {
	--scale: 1.1;
}

.border {
border-width: 7px;
border-style: solid;
border-image: url("images/imageborder.png") 7 fill round;       
}

p.big {
  line-height: 1.5;
} 

h2 {
  color: black;
  text-shadow: -1px 0 white, 0 1px white, 1px 0 white, 0 -1px white;
} 
 
 
 </style>
